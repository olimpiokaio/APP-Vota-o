# ==============================================================================
# Configurações do Ambiente: DES (Desenvolvimento)
# ==============================================================================

# 1. Banco de Dados e Conexão (H2 em Memória para Desenvolvimento Ágil)
spring.datasource.url=${DB_URL:jdbc:h2:mem:votedb_des;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# 2. JPA / Hibernate (DDL Update e SQL Visível Formatado para Debug)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 3. H2 Console (Habilitado para Apoio ao Desenvolvedor)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# 4. Parâmetros da Aplicação e Integrações
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.cpf-validation.url=${CPF_VALIDATION_URL:https://user-info.herokuapp.com/users}
app.cpf-validation.enabled=true
app.cpf-validation.fallback-on-unavailable=true
app.cpf-validation.timeout-ms=3000

# 5. Documentação OpenAPI / Swagger UI (Habilitada)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# 6. Configuração de Logs (Nível Verboso para Desenvolvimento)
logging.level.com.example.demo=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.web=INFO
