# ==============================================================================
# Configurações do Ambiente: TES (Testes / Homologação)
# ==============================================================================

# 1. Banco de Dados e Conexão (H2 Dedicado ou Banco de Testes de Homologação)
spring.datasource.url=${DB_URL:jdbc:h2:mem:votedb_tes;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# 2. JPA / Hibernate (DDL Update, SQL Oculto para logs limpos)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# 3. H2 Console (Desabilitado em Homologação)
spring.h2.console.enabled=false

# 4. Parâmetros da Aplicação e Integrações
app.base-url=${APP_BASE_URL:https://tes-api.exemplo.com}
app.cpf-validation.url=${CPF_VALIDATION_URL:https://tes-user-info.herokuapp.com/users}
app.cpf-validation.enabled=true
app.cpf-validation.fallback-on-unavailable=true
app.cpf-validation.timeout-ms=5000

# 5. Documentação OpenAPI / Swagger UI (Habilitada para Testes de QA)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# 6. Configuração de Logs (Nível Controlado para Testes/Homologação)
logging.level.com.example.demo=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.web=INFO
