# ==============================================================================
# Configurações do Ambiente: PROD (Produção)
# ==============================================================================

# 1. Banco de Dados e Conexão Corporativa (Totalmente parametrizável via Env Vars)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/votedb_prod;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:prod_user}
spring.datasource.password=${DB_PASSWORD:prod_secret_pass}

# 2. JPA / Hibernate (DDL Validate para integridade em produção, SQL oculto)
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# 3. H2 Console (Estritamente Desabilitado em Produção por Segurança)
spring.h2.console.enabled=false

# 4. Parâmetros da Aplicação e Integrações
app.base-url=${APP_BASE_URL:https://api.exemplo.com}
app.cpf-validation.url=${CPF_VALIDATION_URL:https://user-info.exemplo.com/users}
app.cpf-validation.enabled=true
app.cpf-validation.fallback-on-unavailable=false
app.cpf-validation.timeout-ms=2000

# 5. Documentação OpenAPI / Swagger UI (Desabilitada em Produção por Segurança)
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# 6. Configuração de Logs (Nível Estrito e Seguro para Produção)
logging.level.root=WARN
logging.level.com.example.demo=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=ERROR
