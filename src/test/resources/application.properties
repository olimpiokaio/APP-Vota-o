spring.application.name=demo-test

# Configuração do Banco de Dados H2 em memória para testes
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuração do JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

# Inicialização do banco com script SQL de dados fake
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-test.sql

# Desabilitar chamada HTTP externa em testes de integração (usando validação matemática local)
app.base-url=http://localhost:8080
app.cpf-validation.enabled=false
app.cpf-validation.fallback-on-unavailable=true
app.cpf-validation.url=https://user-info.herokuapp.com/users
